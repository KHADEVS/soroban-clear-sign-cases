name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, tests and cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      - name: The cases rebuild exactly as committed
        run: |
          cargo run --locked --bin gen
          cargo run --locked --bin check -- --write
          git diff --exit-code -- cases specs descriptors
      - name: Every case renders as recorded
        run: cargo run --locked --bin check
