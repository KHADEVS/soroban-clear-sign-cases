[package]
name = "soroban-clear-sign-cases"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Test cases for the draft Soroban contract display descriptors SEP, with a reference validator"
publish = false

[dependencies]
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std", "base64", "serde", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
